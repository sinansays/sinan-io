<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zendo</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #ffffff;
  --text: #1f2937;
  --muted-text: #9ca3af;
  --font-sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1216;
    --text: #e5e7eb;
    --muted-text: #6b7280;
  }
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--text);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100dvh;
  cursor: default;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#quote {
  max-width: 38rem;
  padding: 2rem;
  text-align: center;
  opacity: 0;
  animation: fadeIn 0.5s ease forwards;
}
#quote .text {
  font-size: 1.75rem;
  font-weight: 300;
  line-height: 1.7;
  letter-spacing: 0.01em;
  white-space: pre-line;
}
#quote .attr {
  margin-top: 1.2rem;
  font-size: 0.85rem;
  font-weight: 400;
  color: var(--muted-text);
  letter-spacing: 0.04em;
}
footer {
  position: fixed;
  bottom: 0;
  width: 100%;
  padding: 1rem;
  text-align: center;
  font-size: 0.7rem;
  color: var(--muted-text);
  letter-spacing: 0.03em;
  pointer-events: auto;
  cursor: default;
}
footer a {
  color: var(--muted-text);
  text-decoration: none;
}
footer a:hover {
  text-decoration: underline;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}
@media (max-width: 640px) {
  #quote .text { font-size: 1.35rem; }
  #quote { padding: 1.5rem; }
}
</style>
<script>
document.addEventListener('DOMContentLoaded', () => document.activeElement?.blur());
window.addEventListener('load', () => document.activeElement?.blur());
setTimeout(() => document.activeElement?.blur(), 50);
setTimeout(() => document.activeElement?.blur(), 200);
</script>
</head>
<body>
<div id="quote">
  <div class="text" id="text"></div>
  <div class="attr" id="attr"></div>
</div>
<footer>
  Inspired by <a href="https://github.com/CoastalFuturist/bodhi" target="_blank" rel="noopener">Bodhi</a> by <a href="https://coastalfuturist.com" target="_blank" rel="noopener">Coastal Futurist</a> · <a href="https://sinan.io" rel="noopener">sinan.io</a>
</footer>
<script>
const E=[
["Stay hungry. Stay foolish.","Steve Jobs"],

["Design is not just what it looks like. Design is how it works.","Steve Jobs"],
["Your time is limited, so don’t waste it living someone else’s life.","Steve Jobs"],
["You can’t connect the dots looking forward; only backward.","Steve Jobs"],
["Innovation distinguishes between a leader and a follower.","Steve Jobs"],
["Details matter. It’s worth waiting to get it right.","Steve Jobs"],
["Quality is more important than quantity.","Steve Jobs"],
["Real artists ship.","Steve Jobs"],
["I want to put a ding in the universe.","Steve Jobs"],
["The only way to make sense of change is to plunge into it.","Alan Watts"],
["Be completely engaged in the here and now.","Alan Watts"],
["Muddy water is best cleared by leaving it alone.","Alan Watts"],
["You are an aperture through which the universe looks at itself.","Alan Watts"],
["To have faith is to trust yourself to the water.","Alan Watts"],
["No valid plans for the future can be made without living now.","Alan Watts"],
["Trying to define yourself is like trying to bite your own teeth.","Alan Watts"],
["You are something the whole universe is doing.","Alan Watts"],
["Man suffers only because he takes seriously what the gods made for fun.","Alan Watts"],
["We cannot be sensitive to pleasure without being sensitive to pain.","Alan Watts"],
["The aim isn’t to make art. It’s to be in the state where art becomes inevitable.","Rick Rubin"],
["Make something you love, as well as you can, right now.","Rick Rubin"],
["Amplify what makes your perspective unique.","Rick Rubin"],
["The way you do anything is the way you do everything.","Rick Rubin"],
["The magic is in what we don’t understand.","Rick Rubin"],
["Share ideas freely; hoarding dries the river.","Rick Rubin"],
["Awareness is tuning in without clinging.","Rick Rubin"],
["Self-doubt doesn’t disqualify you; keep going.","Rick Rubin"],
["Treat your whole life as a work of art.","Rick Rubin"],
["Inspiration comes first; the audience last.","Rick Rubin"],
["cold morning sidewalk\nsteam rising from street grates\ncity starts to breathe",""],
["empty coffee cup\na ring of light on the desk\nnight’s last conversation",""],
["slow autumn river\none red leaf keeps changing lanes\nwith no destination",""],
["headphones on the train\nstrangers mouthing silent words\neach a private film",""],
["first snow, quiet street\nevery car becomes a ghost\nlooking for a home",""],
["server fans at night\nhumming like a distant hive\ndata dreams in code",""],
["moon above the lot\ngrocery carts in crooked rows\npilgrims of the day",""],
["rain against my screen\ncursor waits in blinking prayer\nfor the next true line",""],
["laundry in the wind\nt-shirts practice taking flight\nfor a better sky",""],
["beach at 3 a.m.\ntide erasing every name\nlike it’s nothing new",""],
["neon diner sign\nflickers on, flickers back off—\nthe cook keeps whistling",""],
["midnight bus station\nkid asleep on his backpack\ndreams a different town",""],
["payphone in the rain\nnobody calling tonight\ndial tone holds its breath",""],
["desert gas station\ncoke machine humming softly\nstars drink with me",""],
["motel bible open\none dead moth between pages—\nresurrection, kid",""],
["dawn freight train passing\ncoffee in a paper cup\nwheels finish my thoughts",""],
["jukebox in the bar\nquarter stuck, song repeats twice\nnobody complains",""],
["rest stop metal sink\ncold water on my face and—\nhey, I’m still here, man",""],
["bus window twilight\npower lines and broken signs\nall spelling “keep going”",""],
["cheap hotel hallway\nice machine coughs in the dark\nsomeone laughs alone",""],
["Two hands clap and there is a sound.\nWhat is the sound of one hand?",""],
["Show me your original face\nbefore your parents were born.",""],
["A monk asked, “What is Buddha?”\nThe master replied, “Three pounds of flax.”",""],
["A student asked, “What is the Way?”\nThe master said, “Walk.”",""],
["A monk said, “I am lonely.”\nThe master asked, “Who is lonely?”",""],
["“Where is enlightenment?”\n“Who is asking?”",""],
["A man chased his shadow all day\nand grew tired. At dusk, he lit a candle.",""],
["The student said, “I understand.”\nThe master poured tea until the cup overflowed.",""],
["“What is God?”\nThe master pointed to the sound of rain.",""],
["“Give me the final truth.”\nThe teacher closed his eyes and said nothing.",""]
];
let last=-1;
function show(){
  let i;
  do{i=Math.random()*E.length|0}while(i===last&&E.length>1);
  last=i;
  const q=document.getElementById("quote");
  q.style.animation="none";
  q.offsetHeight;
  q.style.animation="fadeIn 0.5s ease forwards";
  document.getElementById("text").textContent=E[i][0];
  document.getElementById("attr").textContent=E[i][1]?"— "+E[i][1]:"";
}
show();
document.body.addEventListener("click",function(e){if(e.target.closest("footer"))return;show()});
document.addEventListener("keydown",function(e){if(e.key===" "||e.key==="Enter"){e.preventDefault();show()}});
</script>
</body>
</html>
